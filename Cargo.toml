[package]
name = "xmip-core-authenticate-password"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-authenticate-password"
description = "Authenticate by password: verifies a username and password against the capability's store of salted PBKDF2-HMAC-SHA256 verifiers. A xmip-core-authenticate technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md), and on no sibling (ADR-0050 section 6). The
# mechanism catalog is xmip-core's and the verdict is xmip-core-context's.
authenticate = { workspace = true }
# identify for the names a claim carries across the gates (identify::evidence),
# declared once for the first gate that writes them and this one that reads.
identify = { workspace = true }
xcore = { workspace = true }
context = { workspace = true }

[lints]
workspace = true
